name: 'release'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.1.2 (only needed when a tag push did not trigger this workflow itself)'
        required: true
        type: string

permissions:
  contents: write
  # Needed to force-move the major tag across commits that touch
  # .github/workflows/*, which GitHub otherwise refuses.
  workflows: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run all

      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date - run 'npm run pack' and commit the result."
            git diff --stat dist
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.tag }}" --generate-notes --verify-tag

      - name: Update major version tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          MAJOR="${TAG%%.*}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
